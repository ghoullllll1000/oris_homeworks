<html>

<head>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Afacad:ital,wght@0,400..700;1,400..700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"

    <style>

        body {

        }

        .search-container {

            border-radius: 18.55px;
            padding-left: 27.83px;
            padding-right: 27.83px;

            outline: none;
            background: transparent;
            font-family: "Poppins";
            font-size: 20px;
            font-weight: 400;
            height: 100%;
            line-height: 140%;
        }

        .search-input::placeholder {
            color: #9E9E9E;
        }

        .icons-container {
            display: flex;
            gap: 27.83px;
        }

        .icons-container a {
            width: 65px;
            height: 65px;
            border-radius: 18.57px;
            border: 1.16px;
            background-color: #FAFAFA;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon img {
            width: 32.5px;
        }
